<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply — Anureet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="container header-inner">
    <a href="/" class="brand"><img src="logo.png" alt="Anureet">
      <div class="brand-text"><div class="brand-title">ANUREET</div><div class="brand-sub">PRIVATE LIMITED</div></div>
    </a>
    <nav class="desktop" id="auth-area"></nav>
  </div></header>

  <main class="container" style="padding:40px 20px;max-width:800px;">
    <div id="loading" class="loader"></div>
    <div id="content" style="display:none;">
      <div class="card">
        <span class="tag" id="cat"></span>
        <h1 id="svc-name" style="color:var(--blue-900);margin:8px 0;"></h1>
        <p id="svc-desc" style="color:var(--muted);margin-bottom:20px;"></p>
        <div style="background:var(--blue-50);padding:14px;border-radius:10px;margin-bottom:20px;">
          <b>Fee:</b> <span id="svc-fee" style="color:var(--blue-700);font-size:18px;font-weight:800;"></span>
        </div>

        <form id="apply-form"></form>
        <button class="btn btn-primary" style="width:100%;margin-top:20px;" id="submit-btn">Submit & Pay</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { toast } from './js/main.js';
    import { db, auth, API_URL } from './js/firebase-config.js';
    import { doc, getDoc, addDoc, collection, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    const sid = params.get('id');
    if (!sid) { location.href = '/services.html'; }

    let service = null;

    async function load() {
      const snap = await getDoc(doc(db, 'services', sid));
      if (!snap.exists()) { toast('Service not found', 'error'); location.href = '/services.html'; return; }
      service = { id: snap.id, ...snap.data() };
      document.getElementById('svc-name').textContent = service.name;
      document.getElementById('svc-desc').textContent = service.description || '';
      document.getElementById('svc-fee').textContent = '₹' + (service.fee || 0);
      document.getElementById('cat').textContent = service.category || 'General';

      const form = document.getElementById('apply-form');
      const fields = service.fields || [];
      form.innerHTML = fields.map(f => renderField(f)).join('');
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    function renderField(f) {
      const req = f.required ? 'required' : '';
      const label = `<label>${f.label}${f.required ? ' *' : ''}</label>`;
      let input = '';
      switch (f.type) {
        case 'textarea': input = `<textarea name="${f.name}" placeholder="${f.placeholder||''}" ${req}></textarea>`; break;
        case 'select': input = `<select name="${f.name}" ${req}><option value="">Select...</option>${(f.options||[]).map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`; break;
        case 'number': input = `<input type="number" name="${f.name}" placeholder="${f.placeholder||''}" ${req}>`; break;
        case 'email': input = `<input type="email" name="${f.name}" placeholder="${f.placeholder||''}" ${req}>`; break;
        case 'tel': input = `<input type="tel" name="${f.name}" pattern="[0-9]{10}" placeholder="${f.placeholder||''}" ${req}>`; break;
        case 'date': input = `<input type="date" name="${f.name}" ${req}>`; break;
        case 'file': input = `<input type="file" name="${f.name}" accept="image/*,.pdf" ${req}>`; break;
        default: input = `<input type="text" name="${f.name}" placeholder="${f.placeholder||''}" ${req}>`;
      }
      return `<div class="form-group">${label}${input}</div>`;
    }

    document.getElementById('submit-btn').onclick = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Submitting...';
      try {
        const form = document.getElementById('apply-form');
        const fd = new FormData(form);
        const data = {};
        for (const [k,v] of fd.entries()) data[k] = v;

        // Create application in Firestore
        const appId = 'ANR-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.random().toString(36).substring(2,8).toUpperCase();
        const docRef = await addDoc(collection(db, 'applications'), {
          applicationId: appId,
          userId: auth.currentUser.uid,
          userEmail: auth.currentUser.email,
          serviceId: service.id,
          serviceName: service.name,
          category: service.category,
          data,
          amount: service.fee || 0,
          paymentStatus: 'Pending',
          status: 'Payment Pending',
          createdAt: serverTimestamp()
        });

        // Create Cashfree order via backend
        const token = await auth.currentUser.getIdToken();
        const res = await fetch(`${API_URL}/api/payment/create-order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ applicationId: docRef.id, amount: service.fee || 0 })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Payment init failed');

        // Redirect to Cashfree checkout
        if (json.payment_session_id) {
          const cf = window.Cashfree({ mode: json.env || 'sandbox' });
          cf.checkout({ paymentSessionId: json.payment_session_id, redirectTarget: '_self' });
        } else {
          toast('Payment session created. Order: ' + appId, 'success');
          setTimeout(() => location.href = '/vle-dashboard.html', 1500);
        }
      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Submit & Pay';
      }
    };

    // Notify admin via backend
    load();
  </script>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</body>
</html>
