<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact — Anureet Private Limited</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="container header-inner">
    <a href="/" class="brand"><img src="logo.png" alt="Anureet">
      <div class="brand-text"><div class="brand-title">ANUREET</div><div class="brand-sub">PRIVATE LIMITED</div></div>
    </a>
    <nav class="desktop" id="auth-area"></nav>
  </div></header>

  <main class="container" style="padding:50px 20px;">
    <h1 class="section-title">Contact Us</h1>
    <p class="section-sub">Get in touch for any queries</p>

    <div class="grid-2">
      <div class="card">
        <h3 style="color:var(--blue-900);margin-bottom:16px;">Send Message</h3>
        <form id="contact-form">
          <div class="form-group"><label>Name</label><input class="input" id="c-name" required></div>
          <div class="form-group"><label>Email</label><input type="email" class="input" id="c-email" required></div>
          <div class="form-group"><label>Subject</label><input class="input" id="c-subject" required></div>
          <div class="form-group"><label>Message</label><textarea class="input" id="c-message" required></textarea></div>
          <button class="btn btn-primary" style="width:100%;" id="c-btn">Send Message</button>
        </form>
      </div>
      <div class="card">
        <h3 style="color:var(--blue-900);margin-bottom:16px;">Contact Info</h3>
        <p><b>📞 Phone:</b> +91-9451228744</p>
        <p style="margin-top:10px;"><b>✉️ Email:</b> ahardoi30@gmail.com</p>
        <p style="margin-top:10px;"><b>📍 Address:</b><br>1/7 Kanshiram Colony, Lucknow Road,<br>Hardoi, Uttar Pradesh, India 241001</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { toast } from './js/main.js';
    import { db } from './js/firebase-config.js';
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    document.getElementById('contact-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('c-btn');
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        await addDoc(collection(db,'messages'), {
          name: c_name.value, email: c_email.value, subject: c_subject.value,
          message: c_message.value, createdAt: serverTimestamp(), read: false
        });
        fetch('https://anureet-backend.onrender.com/api/notify/contact', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ name: c_name.value, email: c_email.value, subject: c_subject.value, message: c_message.value })
        }).catch(()=>{});
        toast('Message sent successfully!', 'success');
        e.target.reset();
      } catch (err) { toast('Failed to send', 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Send Message'; }
    };
  </script>
</body>
</html>
