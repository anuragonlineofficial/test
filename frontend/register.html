<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Anureet Private Limited</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="container header-inner">
    <a href="/" class="brand"><img src="logo.png" alt="Anureet">
      <div class="brand-text"><div class="brand-title">ANUREET</div><div class="brand-sub">PRIVATE LIMITED</div></div>
    </a>
  </div></header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Register as VLE</h1>
      <p class="sub">Create your VLE account</p>
      <form id="reg-form">
        <div class="form-group"><label>Full Name</label><input type="text" id="name" class="input" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="email" class="input" required></div>
        <div class="form-group"><label>Mobile (10 digits)</label><input type="tel" id="mobile" pattern="[0-9]{10}" class="input" required></div>
        <div class="form-group"><label>Password (min 6)</label><input type="password" id="password" class="input" minlength="6" required></div>
        <button class="btn btn-primary" style="width:100%;" id="btn">Register</button>
      </form>
      <p style="text-align:center;font-size:14px;margin-top:16px;color:var(--muted);">
        Already registered? <a href="/login.html">Login</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { toast } from './js/main.js';
    import { auth, db } from './js/firebase-config.js';
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    document.getElementById('reg-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Creating account...';
      try {
        const cred = await createUserWithEmailAndPassword(auth, email.value, password.value);
        await setDoc(doc(db, 'users', cred.user.uid), {
          uid: cred.user.uid,
          name: name.value,
          email: email.value,
          mobile: mobile.value,
          role: 'VLE',
          status: 'Active',
          createdAt: serverTimestamp()
        });

        // Send welcome notifications via backend
        fetch('https://anureet-backend.onrender.com/api/notify/registration', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name.value, email: email.value, mobile: mobile.value })
        }).catch(() => {});

        toast('Registration successful!', 'success');
        setTimeout(() => window.location.href = '/vle-dashboard.html', 900);
      } catch (err) {
        toast(err.message.replace('Firebase: ',''), 'error');
      } finally { btn.disabled = false; btn.textContent = 'Register'; }
    };
  </script>
</body>
</html>
