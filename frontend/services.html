<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services — Anureet Private Limited</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="logo.png" alt="Anureet">
        <div class="brand-text"><div class="brand-title">ANUREET</div><div class="brand-sub">PRIVATE LIMITED</div></div>
      </a>
      <nav class="desktop" id="auth-area"></nav>
      <button class="menu-toggle">☰</button>
    </div>
    <div class="mobile-nav">
      <a href="/">Home</a><a href="/services.html">Services</a><a href="/about.html">About</a>
      <a href="/news.html">News</a><a href="/contact.html">Contact</a>
    </div>
  </header>

  <main class="container" style="padding-top:40px;padding-bottom:40px;">
    <h1 class="section-title">Our Services</h1>
    <p class="section-sub">Browse all available digital services</p>

    <div style="max-width:400px;margin-bottom:24px;">
      <input type="text" id="search" class="input" placeholder="🔍 Search services...">
    </div>

    <div class="grid-3" id="services-grid"><div class="loader"></div></div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">© <span id="year"></span> Anureet Private Limited</div>
    </div>
  </footer>

  <script type="module">
    import './js/main.js';
    import { db, auth } from './js/firebase-config.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    document.getElementById('year').textContent = new Date().getFullYear();
    let all = [];

    async function load() {
      const q = query(collection(db, 'services'), where('active','==',true));
      const snap = await getDocs(q);
      all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render(all);
    }

    function render(list) {
      const box = document.getElementById('services-grid');
      if (!list.length) { box.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">No services found.</p>'; return; }
      box.innerHTML = list.map(s => `
        <div class="service-card">
          <div class="service-icon">${s.icon || '📄'}</div>
          <span class="tag">${s.category || 'General'}</span>
          <h3>${s.name}</h3>
          <p>${s.description || ''}</p>
          <div class="service-meta">
            <span class="service-fee">₹${s.fee || 0}</span>
            <a href="/apply.html?id=${s.id}" class="btn btn-primary btn-sm">Apply</a>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('search').oninput = (e) => {
      const s = e.target.value.toLowerCase();
      render(all.filter(x => x.name?.toLowerCase().includes(s) || x.category?.toLowerCase().includes(s)));
    };

    load();
  </script>
</body>
</html>
