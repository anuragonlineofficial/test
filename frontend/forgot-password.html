<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — Anureet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Forgot Password</h1>
      <p class="sub">Enter your email to receive reset link</p>
      <form id="fp-form">
        <div class="form-group"><label>Email</label><input type="email" id="email" class="input" required></div>
        <button class="btn btn-primary" style="width:100%;" id="btn">Send Reset Link</button>
      </form>
      <p style="text-align:center;font-size:14px;margin-top:16px;"><a href="/login.html">Back to Login</a></p>
    </div>
  </div>

  <script type="module">
    import { toast } from './js/main.js';
    import { auth } from './js/firebase-config.js';
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    document.getElementById('fp-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        await sendPasswordResetEmail(auth, email.value);
        toast('Reset link sent to your email', 'success');
      } catch (err) { toast(err.message.replace('Firebase: ',''), 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Send Reset Link'; }
    };
  </script>
</body>
</html>
