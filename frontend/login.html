<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Anureet Private Limited</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="logo.png" alt="Anureet">
        <div class="brand-text"><div class="brand-title">ANUREET</div><div class="brand-sub">PRIVATE LIMITED</div></div>
      </a>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="sub">Login to your account</p>
      <form id="login-form">
        <div class="form-group"><label>Email</label><input type="email" id="email" class="input" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" class="input" required></div>
        <button class="btn btn-primary" style="width:100%;" id="btn">Login</button>
      </form>
      <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:14px;">
        <a href="/forgot-password.html">Forgot password?</a>
        <a href="/register.html">Register</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { toast } from './js/main.js';
    import { auth, db } from './js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        const cred = await signInWithEmailAndPassword(auth, email.value, password.value);
        const snap = await getDoc(doc(db, 'users', cred.user.uid));
        const role = snap.exists() ? snap.data().role : 'VLE';
        toast('Login successful', 'success');
        setTimeout(() => {
          window.location.href = role === 'ADMIN' ? '/admin-dashboard.html' : '/vle-dashboard.html';
        }, 600);
      } catch (err) {
        toast(err.message.replace('Firebase: ',''), 'error');
      } finally { btn.disabled = false; btn.textContent = 'Login'; }
    };
  </script>
</body>
</html>
